discord:
  get:
    tags:
      - Auth
    summary: Discord OAuth認証へリダイレクト
    operationId: redirectDiscord
    security: []
    parameters:
      - name: mode
        in: query
        description: |
          コールバック後のレスポンス形式。
          `redirect` を指定するとフロントエンドURL (`/login/callback`) へリダイレクトする。
          省略または `json` を指定するとJSONでユーザー情報を返す。
        required: false
        schema:
          type: string
          enum:
            - json
            - redirect
          default: json
    responses:
      "308":
        description: Discord OAuth認証ページへリダイレクト

callback:
  get:
    tags:
      - Auth
    summary: Discord OAuthコールバック
    description: |
      Discord OAuthの認証コールバック。
      認証成功時にアクセストークンとリフレッシュトークンをCookieにセットする。
      `mode=json` の場合はユーザー情報をJSONで返す。
      `mode=redirect` の場合はフロントエンドの `/login/callback` へリダイレクトする。
    operationId: callbackDiscord
    security: []
    parameters:
      - name: code
        in: query
        description: Discordから返される認可コード
        required: false
        schema:
          type: string
      - name: error_description
        in: query
        description: ユーザーがキャンセルした場合などのエラー説明
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: OAuthフローで引き回すstateパラメータ（base64エンコードされたJSON）
        required: false
        schema:
          type: string
    responses:
      "200":
        description: 認証成功（mode=json）
        headers:
          Set-Cookie:
            description: access_token および refresh_token のCookieをセット
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/User"
      "302":
        description: 認証成功またはエラー時のリダイレクト（mode=redirect）
        headers:
          Location:
            description: |
              成功時: `{FRONTEND_URL}/login/callback`
              エラー時: `{FRONTEND_URL}/login/callback?error=auth_failed`
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

logout:
  post:
    tags:
      - Auth
    summary: ログアウト
    description: |
      Redisに保存されている全リフレッシュトークンを削除し、Cookieのトークンをクリアしてログアウトする。
    operationId: logout
    security:
      - cookieAuth: []
    responses:
      "200":
        description: ログアウト成功
        content:
          application/json:
            schema:
              nullable: true
              example: null
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

tokenRefresh:
  get:
    tags:
      - Auth
    summary: アクセストークンのリフレッシュ
    description: |
      Cookieのリフレッシュトークンを使って新しいアクセストークンとリフレッシュトークンを発行する。
      成功時は新しいトークンがCookieにセットされる。
    operationId: refreshToken
    security:
      - refreshTokenCookie: []
    responses:
      "200":
        description: トークンのリフレッシュ成功
        headers:
          Set-Cookie:
            description: 新しい access_token および refresh_token のCookieをセット
            schema:
              type: string
        content:
          application/json:
            schema:
              nullable: true
              example: null
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
